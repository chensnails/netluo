# 络图 NetLuo —— 单域名反向代理（一个域名、一张证书、只开 443、只转发一个端口）
#
#   sudo cp topo/nginx/netluo.conf /etc/nginx/conf.d/netluo.conf
#   改 server_name 与证书路径，再：sudo nginx -t && sudo systemctl reload nginx
#
# 对应 .env：DRAWIO_URL 留空（或不写），TRUST_PROXY=1。
# 画布不必单独反代：主站自己把 drawio 转发在同源 /drawio/ 下（server/src/drawio-proxy.js），
# 所以 nginx 只有一个 upstream。同域顺带解决了两类常见问题：https 页面嵌 http 画布被混合内容
# 拦截、CSP frame-src 与画布地址不同源被拦。
#
# 确实要把画布放在别处（独立域名/子域名）时，设 DRAWIO_URL 为浏览器可达的那个地址，并参照
# 1.2.x 的历史版本补一个 location /drawio/ 块（剥前缀 + hide 掉 X-Frame-Options/CSP）。
#
# 下面的端口就是 compose 的主站映射（PORT，默认 3090），改过 PORT 要同步改。
# 平台目前只用轮询，没有 WebSocket / SSE；若哪天换成推送，这里要补 proxy_http_version 与
# Upgrade 头，否则连接会被 nginx 静默断开。

upstream netluo_app {
    server 127.0.0.1:3090;
}

server {
    listen 443 ssl http2;
    server_name topo.example.com;

    ssl_certificate     /etc/ssl/netluo/fullchain.pem;
    ssl_certificate_key /etc/ssl/netluo/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 服务端请求体上限 12MB（一次提交的拓扑/文档，以及 5MB 的图片/附件），留点余量
    client_max_body_size 16m;

    location / {
        proxy_pass http://netluo_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 缺这行 Secure cookie 不生效
        proxy_read_timeout                 60s;      # 画布首屏要拉不少静态文件
    }
}

server {
    listen 80;
    server_name topo.example.com;
    return 301 https://$host$request_uri;
}
