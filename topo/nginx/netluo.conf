# 络图 NetLuo —— 单域名反向代理（一个域名、一张证书、只开 443）
#
#   sudo cp topo/nginx/netluo.conf /etc/nginx/conf.d/netluo.conf
#   改 server_name 与证书路径，再：sudo nginx -t && sudo systemctl reload nginx
#
# 对应 .env：
#   DRAWIO_URL=https://topo.example.com/drawio
#   TRUST_PROXY=1
#
# 为什么这样可行：drawio 页面里的资源全是相对引用（js/main.js、styles/grapheditor.css、
# mxgraph/src/mxClient.js 等），所以只要代理时剥掉 /drawio 前缀，它在子路径下也能正常加载。
# 同域还顺带解决了两类常见问题：https 页面嵌 http 画布被混合内容拦截、以及 CSP frame-src
# 与画布地址不同源被拦。改完 .env 要重建容器（CSP 是进程启动时算的）：
#
#   cd /opt/netluo && docker compose up -d --force-recreate topo
#
# 下面两个 upstream 端口就是 compose 的映射（主站 PORT、画布 3091），改过 PORT 要同步改。
# 平台目前只用轮询，没有 WebSocket / SSE；若哪天换成推送，这里要补 proxy_http_version 与
# Upgrade 头，否则连接会被 nginx 静默断开。

upstream netluo_app {
    server 127.0.0.1:3090;
}

upstream netluo_drawio {
    server 127.0.0.1:3091;
}

server {
    listen 443 ssl http2;
    server_name topo.example.com;

    ssl_certificate     /etc/ssl/netluo/fullchain.pem;
    ssl_certificate_key /etc/ssl/netluo/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 服务端请求体上限 12MB（一次提交的拓扑/文档），留点余量
    client_max_body_size 16m;

    # 画布不带斜杠时补上，否则下面的相对路径会解析到站点根
    location = /drawio {
        return 301 /drawio/;
    }

    # proxy_pass 结尾的 / 才是剥前缀的关键；漏了会把 /drawio/js/main.js 原样转给 drawio
    location /drawio/ {
        proxy_pass http://netluo_drawio/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上游若哪天加了这两个头，同域嵌入也会被挡住
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        proxy_pass http://netluo_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 缺这行 Secure cookie 不生效
    }
}

server {
    listen 80;
    server_name topo.example.com;
    return 301 https://$host$request_uri;
}
